<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>観劇手帖 | 座席レビュー</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="観劇手帖 ホーム">
      <span class="notebook-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-roman">KANGEKI TECHO</span>
        <span class="brand-title" aria-label="観劇手帖">
          <span aria-hidden="true">観</span>
          <span aria-hidden="true">劇</span>
          <span aria-hidden="true">手</span>
          <span aria-hidden="true">帖</span>
        </span>
      </span>
    </a>
    <nav class="nav" aria-label="主要メニュー">
      <a href="index.html">公演検索</a>
      <a class="active" href="reviews.html">座席レビュー</a>
      <a href="post.html">レビュー投稿</a>
      <a href="contact.html">お問い合わせ</a>
    </nav>
  </header>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Seat Reviews</span>
      <h1>座席レビュー</h1>
      <p class="hero-copy">劇場を選んで、座席ごとの見え方や音響レビューを確認できます。</p>
    </div>
  </section>

  <main>
    <section class="section navy" aria-labelledby="reviewsTitle">
      <div class="container layout">
        <div>
          <div class="section-head">
            <div class="section-title">
              <span>Theaters</span>
              <h2 id="reviewsTitle">劇場一覧</h2>
              <p>劇場数が増えても探しやすいよう、一覧ページと劇場詳細ページを分けています。</p>
            </div>
          </div>

          <form class="theater-filter" id="theaterAreaFilter">
            <div class="field">
              <span class="field-label">地域</span>
              <input type="hidden" id="theaterAreaInput" value="全国">
              <div class="region-picker" id="theaterAreaPicker" data-region-picker data-target="theaterAreaInput"></div>
            </div>
            <button class="btn gold" type="submit">劇場を探す</button>
          </form>

          <div class="theater-list" id="theaterList"></div>
        </div>

        <aside class="sidebar" aria-label="補足情報">
          <div class="note">将来はここに劇場エリアやレビュー数での絞り込みを追加できます。</div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <span>© 2026 観劇手帖.</span>
      <span class="footer-links"><a href="privacy.html">プライバシーポリシー</a><a href="rules.html">レビュー投稿ルール</a></span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
