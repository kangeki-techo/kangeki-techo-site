<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>観劇手帖 | 劇場詳細</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="観劇手帖 ホーム">
      <span class="notebook-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-roman">KANGEKI TECHO</span>
        <span class="brand-title" aria-label="観劇手帖">
          <span aria-hidden="true">観</span>
          <span aria-hidden="true">劇</span>
          <span aria-hidden="true">手</span>
          <span aria-hidden="true">帖</span>
        </span>
      </span>
    </a>
    <nav class="nav" aria-label="主要メニュー">
      <a href="index.html">公演検索</a>
      <a class="active" href="reviews.html">座席レビュー</a>
      <a href="post.html">レビュー投稿</a>
      <a href="contact.html">お問い合わせ</a>
    </nav>
  </header>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Theater Detail</span>
      <h1 id="theaterHeroName">劇場詳細</h1>
      <p class="hero-copy">劇場情報、平均評価、座席検索、個別レビューをまとめて確認できます。</p>
    </div>
  </section>

  <main>
    <section class="section navy" aria-labelledby="detailName">
      <div class="container layout">
        <div>
          <p style="margin-top: 0;"><a class="btn subtle back-link" href="reviews.html">劇場一覧へ戻る</a></p>

          <article class="detail-panel" id="theaterDetail">
            <div class="detail-grid">
              <div>
                <span class="card-kicker">劇場詳細</span>
                <h2 class="detail-title" id="detailName"></h2>
                <dl class="info-list">
                  <dt>住所</dt>
                  <dd id="detailAddress"></dd>
                  <dt>アクセス</dt>
                  <dd id="detailAccess"></dd>
                  <dt>座席数</dt>
                  <dd id="detailCapacity"></dd>
                  <dt>公式サイト</dt>
                  <dd><a class="theater-link" id="detailOfficialUrl" href="#" target="_blank" rel="noopener noreferrer">公式サイトを見る</a></dd>
                  <dt>座席表</dt>
                  <dd><a class="theater-link" id="detailSeatMapUrl" href="#" target="_blank" rel="noopener noreferrer">公式サイトで座席表を見る</a></dd>
                </dl>
              </div>
            </div>

            <form class="search-small" id="seatSearch">
              <p class="seat-search-help">「階」「列」「番」のうち、1項目以上を選択して座席を検索できます。</p>
              <label>
                階
                <select id="floorInput"></select>
              </label>
              <label>
                列
                <select id="rowInput"></select>
              </label>
              <label>
                番
                <select id="seatInput"></select>
              </label>
              <button class="btn" type="submit">座席検索</button>
            </form>

            <form class="search-small keyword-search" id="otherKeywordSearch" hidden>
              <label>
                キーワード検索
                <input id="otherKeywordInput" type="search" placeholder="劇場名・作品名・座席・コメント">
              </label>
              <button class="btn" type="submit">レビューを探す</button>
            </form>

            <div class="stats" id="stats"></div>

            <div class="results-meta" id="reviewMeta"></div>
            <div class="reviews" id="reviewList"></div>
            <p class="bottom-back-link"><a class="btn subtle back-link" href="reviews.html">劇場一覧へ戻る</a></p>
          </article>
        </div>

        <aside class="sidebar" aria-label="補足情報">
          <div class="note">劇場詳細ページは「シアタークリエ 座席 見え方」のような検索にも強くしやすい構成です。</div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <span>© 2026 観劇手帖.</span>
      <span class="footer-links"><a href="privacy.html">プライバシーポリシー</a><a href="rules.html">レビュー投稿ルール</a></span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
